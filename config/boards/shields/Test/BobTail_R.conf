
CONFIG_ZMK_KEYBOARD_NAME="BobTail"
CONFIG_ZMK_MOUSE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_BOBTAIL_PROFILE_BLE_NAMES=y
CONFIG_BOBTAIL_DISCONNECT_INACTIVE_HOSTS=y
CONFIG_BOBTAIL_PAIRING_DIAGNOSTICS=y

# Optional clock comparison via the diagnostic key; start with the normal mode.
CONFIG_BOBTAIL_CLOCK_DIAGNOSTIC=y
CONFIG_BOBTAIL_KEEP_HFXO_ON=n

CONFIG_BT_DEVICE_NAME_MAX=30


CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# Native sensor cadence avoids waiting for a second motion sample in software.
CONFIG_PMW3610_POLLING_RATE_125=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=800

CONFIG_PMW3610_MOVEMENT_THRESHOLD=2

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# Suspected 60-second battery-only stalls: remove the periodic ADC/GPIO sampling.
# Keep the existing GATT service and low-priority queue to isolate this change.
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_BT_BAS=y
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
#CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y


CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 
